name: LifeLink tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: CHROME_PATH=$(find ~/.cache/ms-playwright -path '*/chrome-linux*/chrome' -type f | head -1) npm run test:ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lifelink-previews
          path: artifacts/
