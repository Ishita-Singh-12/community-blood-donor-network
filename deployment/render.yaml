# Preparation only: import this Blueprint after approving Render + Atlas setup.
services:
  - type: web
    name: lifelink-api
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: TRUST_PROXY
        value: "1"
      - key: CLIENT_ORIGIN
        sync: false
      - key: MONGODB_URI
        sync: false
